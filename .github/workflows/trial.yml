name: Trial adapter checks
on:
  push:
    branches: ['engineering/**']
  pull_request:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run test:trial
      - run: npm run build:trial
