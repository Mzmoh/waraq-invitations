name: Trial adapter checks
on:
  push:
    branches: ['engineering/**']
  pull_request:
permissions:
  contents: read
jobs:
  trial:
    name: trial (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run test:trial
      - run: npm run build:trial
